[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval"
version = "0.1.0"
description = "Evaluate multi-step, tool-using LLM agents with trajectory capture, an LLM judge, and deterministic assertions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "pydantic>=2",
    "pandas",
    "typer",
]

[project.scripts]
agent-eval = "agent_eval.cli:app"

[tool.setuptools.packages.find]
include = ["agent_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
